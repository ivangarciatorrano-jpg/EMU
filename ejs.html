<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Consola</title>
<style>html,body{margin:0;height:100%;background:#000;color:#fff;font:600 15px system-ui,sans-serif;overflow:hidden}#game{width:100%;height:100%}#err{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px}</style>
</head><body><div id="game"></div><div id="err" hidden></div>
<script>
/* EmulatorJS (https://emulatorjs.org, GPL-3.0) cargado desde su CDN oficial. El juego sale del IndexedDB de la app. */
const q=new URLSearchParams(location.search),id=q.get("id"),core=q.get("core"),name=q.get("name")||"juego";
const fail=t=>{const e=document.getElementById("err");e.textContent=t;e.hidden=false};
const op=indexedDB.open("gfNes");
op.onerror=()=>fail("No se pudo abrir tu biblioteca de juegos.");
op.onsuccess=()=>{let st;try{st=op.result.transaction("roms","readonly").objectStore("roms").get(id)}catch(e){fail("No se pudo leer el juego.");return}
  st.onsuccess=()=>{const rom=st.result;if(!rom){fail("No encuentro este juego en el móvil.");return}
    window.EJS_player="#game";window.EJS_core=core;window.EJS_gameName=name.replace(/[#<$+%>!`&*'|{}/\\?"=@:^\r\n]/g,"");
    window.EJS_gameUrl=URL.createObjectURL(rom.data instanceof Blob?rom.data:new Blob([rom.data]));
    window.EJS_pathtodata="https://cdn.emulatorjs.org/4.2.3/data/";
    window.EJS_language="es-ES";window.EJS_color="#DB2777";window.EJS_startButtonName="▶ Jugar";
    window.EJS_backgroundColor="#000";window.EJS_Buttons={netplay:false,cheat:false,exitEmulation:false};
    const s=document.createElement("script");s.src=EJS_pathtodata+"loader.js";s.onerror=()=>fail("Necesitas conexión a internet para cargar esta consola la primera vez.");document.body.appendChild(s)}};
</script>
</body></html>
